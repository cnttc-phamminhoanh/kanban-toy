name: Deploy Kanban Toys

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Pull code
        run: |
          cd /home/it/kanban-toy
          git pull --ff-only "https://x-access-token:${GITHUB_TOKEN}@github.com/cnttc-phamminhoanh/kanban-toy.git" master
          git reset --hard FETCH_HEAD
          git status --short

      - name: Install package
        run: |
          cd /home/it/kanban-toy/server
          npm ci --no-audit --no-fund

      - name: Install and bundle UI
        run: |
          cd /home/it/kanban-toy/client
          npm ci --no-audit --no-fund
          npm run build

      - name: Restart server
        run: |
          cd /home/it/kanban-toy/server
          pm2 restart kanban-toy-api || pm2 start app.js --name kanban-toy-api
